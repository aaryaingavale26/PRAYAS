<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRAYAS Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  
  <div class="popup-container">
    
    <!-- MODE A: MAIN ASSISTANT PANEL (MATCHING IMAGE 3) -->
    <div class="main-panel-view" id="mainPanelView">
      
      <!-- Header -->
      <header class="assistant-header">
        <div class="header-left">
          <div class="mic-icon-box" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </div>
          <div class="header-v-divider"></div>
          <h1 class="header-title">PRAYAS Assistant</h1>
        </div>

        <div class="header-right">
          <div class="ready-pill" id="readyPill">
            <span class="ready-dot"></span>
            <span id="readyPillText">READY</span>
          </div>
        </div>
      </header>

      <!-- User Identity Strip (Shared Session A.1) -->
      <div class="user-identity-strip" id="userIdentityStrip">
        <span class="user-icon" aria-hidden="true">👤</span>
        <span class="user-email-text" id="userEmailText">Checking login status...</span>
        <a href="http://localhost:3000/auth/login" target="_blank" class="user-login-link" id="userLoginLink" style="display: none;">Log in</a>
      </div>

      <!-- Status Message Box -->
      <div class="status-msg-box" id="statusBox" role="status" aria-live="polite">
        Ready. Tap Speak (Alt+M), press a shortcut, or type a command.
      </div>

      <!-- Controls Row: Tap & Speak + Stop -->
      <div class="action-controls-row">
        <button type="button" class="btn-tap-speak" id="btnTapSpeak" aria-label="Tap and Speak voice command (Alt+M)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span>Tap &amp; Speak</span>
          <span class="badge-shortcut">Alt+M</span>
        </button>

        <button type="button" class="btn-stop-audio" id="btnStopAudio" aria-label="Stop audio (Escape)">
          <span style="font-size: 13px;">■</span>
          <span>Stop</span>
          <span class="badge-shortcut">Esc</span>
        </button>
      </div>

      <!-- Feature Button: Voice Call with Prayas.AI -->
      <button type="button" class="btn-voice-call-trigger" id="btnStartVoiceCall" title="Start live guided voice call">
        <div class="voice-call-btn-left">
          <img src="prayas-avatar.png" alt="Prayas.AI" class="olivia-mini-avatar" onerror="this.style.display='none'" />
          <span>Voice Call with Prayas.AI</span>
        </div>
        <span class="voice-call-badge">Interactive AI</span>
      </button>

      <!-- 3x2 Grid of Shortcuts -->
      <div class="shortcuts-grid">
        <button type="button" class="shortcut-cell-btn" data-cmd="next field" id="scNext" aria-label="Next Field (Alt+N)">
          <span class="sc-title">Next Field</span>
          <span class="sc-badge">Alt+N</span>
        </button>

        <button type="button" class="shortcut-cell-btn" data-cmd="previous field" id="scPrev" aria-label="Previous Field (Alt+B)">
          <span class="sc-title">Prev Field</span>
          <span class="sc-badge">Alt+B</span>
        </button>

        <button type="button" class="shortcut-cell-btn" data-cmd="read question" id="scReadQ" aria-label="Read Question (Alt+R)">
          <span class="sc-title">Read Q</span>
          <span class="sc-badge">Alt+R</span>
        </button>

        <button type="button" class="shortcut-cell-btn" data-cmd="read this page" id="scPage" aria-label="Page Info (Alt+W)">
          <span class="sc-title">Page Info</span>
          <span class="sc-badge">Alt+W</span>
        </button>

        <button type="button" class="shortcut-cell-btn" data-cmd="fill my details" id="scAutofill" aria-label="Autofill (Alt+F)">
          <span class="sc-title">Autofill</span>
          <span class="sc-badge">Alt+F</span>
        </button>

        <button type="button" class="shortcut-cell-btn" data-cmd="ai draft" id="scDraft" aria-label="AI Draft (Alt+H)">
          <span class="sc-title">AI Draft</span>
          <span class="sc-badge">Alt+H</span>
        </button>
      </div>

      <!-- Type Command Section -->
      <form class="type-command-section" id="commandForm" onsubmit="event.preventDefault();">
        <div class="type-command-header">
          <span>TYPE COMMAND / ANSWER</span>
          <div class="type-command-divider"></div>
        </div>
        <div class="type-command-input-row">
          <input
            type="text"
            id="commandInput"
            class="type-command-input"
            placeholder="Type command or answer..."
            aria-label="Type command input"
            autocomplete="off"
          />
          <button type="submit" class="btn-run-command" id="btnRunCommand">Run</button>
        </div>
      </form>

    </div>

    <!-- MODE B: VOICE CALL SCREEN (MATCHING IMAGE 2 + IMAGE 4 BRANDING) -->
    <div class="voice-call-screen-view" id="callScreenView">
      
      <!-- Call Top Bar -->
      <div class="call-top-bar">
        <button type="button" class="call-round-nav-btn" id="callBackBtn" title="Back to Assistant" aria-label="Back to assistant">
          ←
        </button>
        <div class="call-center-meta">
          <h2 class="call-assistant-name">Prayas.AI</h2>
          <span class="call-running-timer" id="callTimer">00:00</span>
        </div>
        <button type="button" class="call-round-nav-btn" id="callMinBtn" title="Minimize" aria-label="Minimize">
          —
        </button>
      </div>

      <!-- Round Avatar with Pulse Animation & Image 4 Logo -->
      <div class="call-avatar-container" id="callAvatarContainer">
        <div class="call-avatar-ripple"></div>
        <img src="prayas-avatar.png" alt="Prayas.AI Voice Assistant" class="call-avatar-img" />
      </div>

      <!-- Call Field Progress & Navigation (C.3 & C.4) -->
      <div class="call-field-controls-row">
        <button type="button" class="call-nav-step-btn" id="callPrevBtn" title="Previous field (Alt+B)" aria-label="Previous field">
          ◀ Prev
        </button>
        <span class="call-progress-badge" id="callProgressBadge">Field 1 of --</span>
        <button type="button" class="call-skip-btn" id="callSkipBtn" title="Skip this field (or say 'skip')" aria-label="Skip this field">
          ⏭ Skip
        </button>
        <button type="button" class="call-nav-step-btn" id="callNextBtn" title="Next field (Alt+N)" aria-label="Next field">
          Next ▶
        </button>
      </div>

      <!-- Live Status Pill & Transcript Box -->
      <div class="call-status-pill" id="callStatusPill">
        ● CONNECTING...
      </div>

      <div class="call-live-transcript" id="callLiveTranscript" role="status" aria-live="polite">
        Starting voice call with Prayas.AI. Preparing form fields...
      </div>

      <!-- Bottom Round Action Buttons -->
      <div class="call-bottom-controls">
        <button type="button" class="call-round-action-btn" id="callSpeakerBtn" title="Repeat Prompt / Toggle Speaker" aria-label="Repeat prompt or toggle speaker">
          🔊
        </button>

        <button type="button" class="call-round-action-btn" id="callMicBtn" title="Toggle Mic" aria-label="Toggle mic">
          🎤
        </button>

        <button type="button" class="call-round-action-btn call-end-btn" id="callEndBtn" title="End Voice Call" aria-label="End call">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.09-8.65A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
            <line x1="22" x2="2" y1="2" y2="22"/>
          </svg>
        </button>
      </div>

    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
